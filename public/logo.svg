<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo « Oiseau sur sa feuille » (novembre 2026) : l'oiseau posé sur une feuille, près d'une pousse.
       Source des icônes PWA : voir scripts/icons/README.md. -->
  <title>Carnet Naturaliste</title>
  <defs>
    <!-- Vert vif : jaune-vert en haut à gauche, vert profond en bas à droite. -->
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ADD45"/>
      <stop offset="0.42" stop-color="#22BF3A"/>
      <stop offset="1" stop-color="#03A02E"/>
    </linearGradient>
    <!-- Feuille posée au sol : vert anis, qui s'estompe vers la gauche. -->
    <linearGradient id="sol" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#9FEE70" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#A6F073" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B8F682"/>
    </linearGradient>
    <!-- L'œil et l'aile sont percés : le vert du fond transparaît. -->
    <mask id="decoupes" maskUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712">
      <rect x="-100" y="-100" width="712" height="712" fill="#fff"/>
      <circle cx="311.2" cy="150.6" r="12.6"/>
      <path d="M280.6 217 C291.6 282 211.6 332 135.4 308 C201.4 302 263.4 264 280.6 217 Z"/>
    </mask>
    <clipPath id="tuile"><rect width="512" height="512" rx="132"/></clipPath>
  </defs>
  <g clip-path="url(#tuile)">
    <rect width="512" height="512" fill="url(#fond)"/>
    <g transform="translate(10 -14)">
      <path d="M29 471.7 C80 425 150 401 230 401 C310 401 375 418 417.5 435.4 C370 427 300 414 230 415 C160 416 100 440 52 483.6 Z" fill="url(#sol)"/>
      <g fill="#FFFFFF" mask="url(#decoupes)">
        <path d="M86 293 C130.5 267 194 184.5 223.2 132.5 C238 106 262 96.5 293.2 96.6 C322 96 346 117 357.4 134.8 L396.4 138.1 L361 167.8 C357.8 185 362.4 205 361.6 228 C360.6 300.5 310 365.4 234 365.4 C180 367.5 118 338 86 293 Z"/>
        <path d="M200.8 358 L200.8 398 Q200.8 402.3 205 402.3 L236 402.3 Q240.5 402.3 240 398.5 Q239.3 394.6 234 394 L222 393 Q215.4 392.4 215.4 386 L215.4 358 Z M251 358 L251 401 Q251 405.6 255.5 405.6 L288 405.6 Q293 405.6 292.7 401.5 Q292.2 397.6 287 396.9 L273 395.3 Q265.6 394.5 265.6 388 L265.6 358 Z"/>
      </g>
      <!-- La pousse, en blanc crème. -->
      <g fill="#FEFEEF">
        <path d="M371.5 372 L378.5 373 C377 390 371 405 365 417 L360.5 416.5 C365 402 370 388 371.5 372 Z"/>
        <path d="M371 386 C371 364 359 344 328 341 C327 366 349 386 371 386 Z"/>
        <path d="M375.2 372.6 C400 366 432 352 435 318 C437 305 437 297 436 290 C415 291 392 300 382 316 C374 330 372 345 374.6 356.1 C380 343 388 331 397.7 323.7 C389 336 381 352 375.2 372.6 Z"/>
      </g>
    </g>
  </g>
</svg>
