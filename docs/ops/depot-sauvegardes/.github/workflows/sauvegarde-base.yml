name: Sauvegarde de la base

# Sauvegarde hebdomadaire de la base Supabase (l'offre gratuite n'en fournit
# aucune). Le resultat est chiffre puis conserve en artefact GitHub.
#
# OU CE WORKFLOW S'EXECUTE : uniquement dans le depot PRIVE
# Limuletempedte/carnet-naturaliste-sauvegardes, qui porte aussi le secret et
# la cle publique. Un artefact herite de la visibilite de son depot : dans un
# depot public, n'importe quel compte GitHub pourrait telecharger l'archive.
# Le depot de code public (carnet-naturaliste) n'en garde qu'une copie de
# reference, jamais executee : docs/ops/depot-sauvegardes/.
# Toute modification se fait d'abord la-bas (PR), puis se recopie a
# l'identique dans le depot prive.
#
# Mode d'emploi complet, restauration comprise (dans le depot de code) :
# docs/ops/RUNBOOK-sauvegarde-restauration.md

on:
  schedule:
    # Tous les dimanches a 03h17 UTC. Minute volontairement decalee : les crons
    # "ronds" (0 3 * * 0) sont massivement utilises et GitHub peut retarder,
    # voire abandonner, les executions planifiees aux heures de pointe.
    - cron: '17 3 * * 0'
  # Permet de lancer une sauvegarde a la demande depuis l'onglet Actions.
  workflow_dispatch:

# Ce job ne lit pas le code du depot et n'y ecrit rien : aucun droit necessaire
# (le controle de visibilite lit seulement la fiche du depot : public ou prive).
permissions: {}

concurrency:
  group: sauvegarde-base
  cancel-in-progress: false

jobs:
  sauvegarde:
    name: Export chiffre de la base Supabase
    # Version epinglee volontairement : un job hebdomadaire ne doit pas casser
    # le jour ou `ubuntu-latest` bascule vers une nouvelle image.
    runs-on: ubuntu-24.04
    # Large : la CLI telecharge une image Docker PostgreSQL a chaque execution.
    timeout-minutes: 30

    steps:
      - name: Verifier que le depot est prive
        env:
          JETON: ${{ github.token }}
        run: |
          set -euo pipefail
          # Garde-fou : si ce fichier est un jour recopie dans un depot public,
          # le job s'arrete AVANT de toucher a la base. Un depot public se lit
          # sans restriction (reponse 200, "private": false) ; un depot prive
          # renvoie 200 avec "private": true, ou 404 si le jeton ne voit pas
          # ses metadonnees. Toute autre reponse : on reessaie, puis on arrete.
          for tentative in 1 2 3; do
            # -L : suit la redirection d'un depot renomme.
            code=$(curl -sSL -o depot.json -w '%{http_code}' \
              -H "Authorization: Bearer ${JETON}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}" || echo "000")
            if [ "${code}" = "404" ]; then
              prive=true
              break
            fi
            if [ "${code}" = "200" ]; then
              prive=$(jq -r '.private' depot.json)
              break
            fi
            if [ "${tentative}" -eq 3 ]; then
              echo "::error::Impossible de verifier la visibilite du depot (reponse HTTP ${code}). Relancer le workflow plus tard."
              exit 1
            fi
            sleep 20
          done
          rm -f depot.json

          if [ "${prive}" != "true" ]; then
            echo "::error::Ce depot est PUBLIC : l'archive serait telechargeable par tout le monde. Ce workflow ne doit tourner que dans le depot prive carnet-naturaliste-sauvegardes. Voir docs/ops/RUNBOOK-sauvegarde-restauration.md."
            exit 1
          fi
          echo "Depot prive : OK."

      - name: Verifier la configuration
        env:
          URL_BASE: ${{ secrets.SUPABASE_DB_URL }}
          CLE_PUBLIQUE: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          erreur=0

          if [ -z "${URL_BASE}" ]; then
            echo "::error::Le secret SUPABASE_DB_URL est absent. Voir docs/ops/RUNBOOK-sauvegarde-restauration.md, section « Mise en service »."
            erreur=1
          elif [ "${URL_BASE#*pooler.supabase.com}" = "${URL_BASE}" ]; then
            # Garde-fou : les runners GitHub sont IPv4 uniquement, alors que la
            # connexion directe Supabase (db.<ref>.supabase.co) est en IPv6.
            # Sans cette verification, l'erreur serait un « Network is
            # unreachable » difficile a interpreter.
            echo "::error::SUPABASE_DB_URL ne pointe pas vers le pooler Supabase. Utilisez la chaine « Session pooler » (hote en .pooler.supabase.com, port 5432), pas la connexion directe."
            erreur=1
          elif [ "${URL_BASE#*:6543}" != "${URL_BASE}" ]; then
            echo "::error::SUPABASE_DB_URL utilise le port 6543 (mode transaction), incompatible avec un export. Utilisez la chaine « Session pooler », port 5432."
            erreur=1
          fi

          if [ -z "${CLE_PUBLIQUE}" ]; then
            echo "::error::La variable BACKUP_AGE_PUBLIC_KEY est absente. Sans elle, la sauvegarde contiendrait des donnees personnelles en clair : le job s'arrete volontairement."
            erreur=1
          fi

          if [ "${erreur}" -ne 0 ]; then
            exit 1
          fi
          echo "Configuration valide."

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Version figee = meme resultat chaque semaine. Dependabot ne suit
          # ni elle ni les actions epinglees par SHA de ce fichier (le depot
          # prive n'a pas de veille) : les mettre a jour a la main lors d'une
          # recopie, la CLI au niveau de celle du package.json du depot de code.
          version: 2.109.1

      - name: Installer age (chiffrement)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age

      - name: Exporter la base
        env:
          URL_BASE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p sauvegarde

          # Trois exports distincts, tels que recommandes par Supabase : les
          # roles et le schema d'abord, les donnees ensuite. L'ordre compte a la
          # restauration (voir le runbook).
          # La CLI passe par une image Docker PostgreSQL 17, ce qui evite le
          # piege du client PostgreSQL 16 preinstalle sur le runner (un pg_dump
          # plus ancien que le serveur refuse de s'executer).
          for tentative in 1 2 3; do
            if supabase db dump --db-url "${URL_BASE}" --role-only -f sauvegarde/roles.sql 2> erreur.log; then
              break
            fi
            cat erreur.log

            # Une chaine de connexion invalide ne guerira pas toute seule :
            # inutile de reessayer, et le message doit dire quoi corriger.
            # Cas verifie : un mot de passe contenant #, ? ou % casse l'analyse
            # de l'URL (un @ passe, lui).
            if grep -q 'failed to parse connection string' erreur.log; then
              echo "::error::Le secret SUPABASE_DB_URL n'a pas pu etre analyse. Cause la plus frequente : le mot de passe de la base contient un caractere special (#, ?, %, /). Corrigez en reinitialisant le mot de passe Supabase avec des lettres et des chiffres uniquement, puis mettez le secret a jour. Voir docs/ops/RUNBOOK-sauvegarde-restauration.md, section « Mise en service »."
              exit 1
            fi

            if [ "${tentative}" -eq 3 ]; then
              echo "::error::Export des roles impossible apres 3 tentatives. Voir le detail de l'erreur ci-dessus."
              exit 1
            fi
            echo "Tentative ${tentative} echouee, nouvelle tentative dans 30 s (telechargement de l'image Docker ou reseau)."
            sleep 30
          done
          rm -f erreur.log

          supabase db dump --db-url "${URL_BASE}" -f sauvegarde/schema.sql
          # --use-copy : forme documentee par Supabase pour l'export de donnees.
          # Sans ce drapeau, la CLI produit des INSERT ligne a ligne — beaucoup
          # plus volumineux et bien plus lents a restaurer que des blocs COPY.
          # Tables internes du stockage vectoriel : leur COPY est refusé lors
          # d'une restauration standard (procédure Supabase du 8 octobre 2026).
          supabase db dump --db-url "${URL_BASE}" --use-copy --data-only \
            --exclude storage.buckets_vectors --exclude storage.vector_indexes \
            -f sauvegarde/data.sql

          ls -lh sauvegarde/

      - name: Verifier le contenu de la sauvegarde
        run: |
          set -euo pipefail

          # PIEGE VERIFIE : quand l'export echoue, la CLI laisse malgre tout un
          # fichier de 0 octet derriere elle. Constater que « le fichier existe »
          # ne prouve donc rien du tout — il faut regarder ce qu'il contient.
          verifier_taille() {
            fichier="$1"
            minimum="$2"
            taille=$(stat -c%s "${fichier}")
            if [ "${taille}" -lt "${minimum}" ]; then
              echo "::error::${fichier} ne fait que ${taille} octets (minimum attendu : ${minimum}). L'export a echoue ou la base est vide."
              exit 1
            fi
            echo "${fichier} : ${taille} octets"
          }

          verifier_taille sauvegarde/roles.sql 100
          verifier_taille sauvegarde/schema.sql 2000
          verifier_taille sauvegarde/data.sql 10000

          # Le schema doit decrire la table applicative.
          if ! grep -q 'observations' sauvegarde/schema.sql; then
            echo "::error::La table observations est absente du schema exporte."
            exit 1
          fi

          # Les donnees doivent contenir des observations ET des comptes : si
          # les droits d'acces filtraient silencieusement les lignes, le fichier
          # aurait l'air correct tout en etant inexploitable.
          #
          # On accepte les DEUX formats que la CLI sait produire — blocs COPY
          # (avec --use-copy, ce que fait ce workflow) ou INSERT ligne a ligne —
          # pour que le controle survive a un changement de comportement.
          compter_lignes() {
            table="$1"
            awk -v t="${table}" '
              # Ouverture d un bloc COPY pour la table visee.
              $0 ~ "^COPY [\"]?[a-z_]+[\"]?[.][\"]?" t "[\"]?" { dans_copy = 1; next }
              # Fin de bloc COPY.
              dans_copy && /^\\\.$/ { dans_copy = 0; next }
              dans_copy { n++; next }
              # Format INSERT.
              $0 ~ "^INSERT INTO [\"]?[a-z_]+[\"]?[.][\"]?" t "[\"]?" { n++ }
              END { print n + 0 }
            ' sauvegarde/data.sql
          }

          observations=$(compter_lignes observations)
          comptes=$(compter_lignes users)

          if [ "${comptes}" -lt 1 ]; then
            echo "::error::Aucune donnee de compte (auth.users) dans la sauvegarde."
            exit 1
          fi

          if [ "${observations}" -lt 1 ]; then
            echo "::error::La sauvegarde ne contient aucune observation."
            exit 1
          fi

          echo "Contenu verifie : ${observations} observations, ${comptes} comptes."

          # Recapitulatif lisible sur la page de l'execution. Purement cosmetique :
          # il ne doit jamais faire echouer une sauvegarde par ailleurs valide.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Sauvegarde du $(date -u '+%d/%m/%Y')"
              echo ""
              echo "- Observations : **${observations}**"
              echo "- Comptes : **${comptes}**"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Chiffrer la sauvegarde
        env:
          CLE_PUBLIQUE: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          horodatage=$(date -u '+%Y-%m-%d')
          echo "HORODATAGE=${horodatage}" >> "${GITHUB_ENV}"

          # Chiffrement APRES les verifications : une fois chiffre, plus rien
          # n'est lisible, y compris pour nous.
          tar -czf "sauvegarde-${horodatage}.tar.gz" -C sauvegarde .
          age -r "${CLE_PUBLIQUE}" -o "sauvegarde-${horodatage}.tar.gz.age" "sauvegarde-${horodatage}.tar.gz"

          # Ne laisser aucune version en clair sur le runner.
          rm -f "sauvegarde-${horodatage}.tar.gz"
          rm -rf sauvegarde

          ls -lh "sauvegarde-${horodatage}.tar.gz.age"

      - name: Deposer l'archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Nom lisible : le jour d'un incident on cherche une date, pas un
          # identifiant d'execution.
          name: sauvegarde-base-${{ env.HORODATAGE }}
          path: sauvegarde-${{ env.HORODATAGE }}.tar.gz.age
          # Le fichier est deja compresse et chiffre : pas de double emballage.
          compression-level: 0
          if-no-files-found: error
          # Duree de conservation. A relire une fois la taille reelle connue
          # (voir le runbook) : 90 jours est le maximum et reste tenable tant
          # que l'archive pese quelques megaoctets.
          retention-days: 35
