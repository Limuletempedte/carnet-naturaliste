<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <!-- CO-21: viewport-fit=cover pour exposer env(safe-area-inset-*) sur iPhone notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Carnet Naturaliste</title>

  <!-- CO-03: favicon explicite ; SVG en priorite (oiseau seul, lisible en petit), .ico 16/32/48 en secours -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- CO-02: meta tags Apple pour mode standalone iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Carnet Naturaliste" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- CO-05: theme color aligne sur le fond beige plutot que blanc -->
  <meta name="theme-color" content="#F2F2F7" />
</head>

<body class="bg-nature-beige text-nature-dark font-sans antialiased selection:bg-nature-green selection:text-white">
  <!-- Lien d'evitement : cache hors ecran, il apparait au focus clavier grace a
       la regle .skip-link de index.css. Aucun gestionnaire onfocus/onblur ici :
       la CSP de production (script-src sans 'unsafe-inline') les bloquerait. -->
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
